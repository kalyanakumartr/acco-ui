<div class="container-fluid " style="background: linear-gradient(to right, #f5d28a, #fff7e6);">
  <!-- Top Row: Logo, Marquee, and Helpline -->
  <div class="row align-items-center justify-content-between">
    <!-- Logo Section -->
    <div class="col-lg-3 col-md-3 col-12 text-center text-md-left mb-2 mb-md-0">
      <img src="assets/index_logo.jpg" class="img-fluid" alt="Logo" style="max-height: 100px;">
    </div>

    <!-- Marquee Section -->
    <div class="col-lg-7 col-md-6 col-12 text-center mb-2 mb-md-0">
      <marquee behavior="scroll" direction="left">
        Welcome to MaduraaServices - 10% off for Margali Utasavam.
      </marquee>
    </div>

    <!-- Helpline Section -->
    <div class="col-lg-2 col-md-3 col-12 text-md-right text-center mb-2 mb-md-0">
      <span >
        24/7 HelpLine<br>
        Ph: +91 73738 26373
      </span>
      <!-- Login/Signup/Logout Buttons -->
      <div class="mt-2">
        <button *ngIf="!authService.logged()" routerLink="/login" class="btn  btn-sm mx-1">Login</button>
        <button *ngIf="!authService.logged()" (click)="signup()" class="btn  btn-sm mx-1">Signup</button>
        <button *ngIf="authService.logged()" (click)="logout()" class="btn  btn-sm mx-1">Logout</button>
      </div>
    </div>
  </div>

  <!-- Navigation Section -->
  <div class="row mt-0">
    <div class="col-12" >
      <!-- Navbar Section -->
      <nav class="navbar navbar-expand-lg navbar-light  ">
      
        <!-- Toggler Button for Mobile View -->
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav text-center">
            <li class="nav-item mx-2">
              <a class="btn btn-sm" routerLink="/home">HOME</a>
            </li>
            <li class="nav-item mx-2" *ngIf=" tokenvalue!==null" [ngClass]="!isDisabled ? 'nav-item active' : 'nav-item disabled'">
              <a  class="btn btn-sm" routerLink="/mybookings">BOOKINGS</a>
            </li>
            <li class="nav-item mx-2">
              <a class="btn btn-sm" routerLink="/facitilies">FACILITIES</a>
            </li>
            <li class="nav-item mx-2">
              <a class="btn btn-sm" routerLink="/tariff">TARIFF</a>
            </li>
            <li class="nav-item mx-2">
              <a class="btn  btn-sm" routerLink="/placetovisit">PLACES TO VISIT</a>
            </li>
            <li class="nav-item mx-2">
              <a class="btn  btn-sm" routerLink="/travel">TRAVEL</a>
            </li>
            <li class="nav-item mx-2">
              <a class="btn btn-sm" routerLink="/contactus">CONTACT US</a>
            </li>
          </ul>
        </div>

        <!-- User Icon Section -->
        <div class="d-flex align-items-center ml-auto mr-3">
          <i class="fa fa-user text-warning" ></i>
          <span class="ml-2 font-weight-bold">{{ username | titlecase }}</span>
        </div>
      </nav>
    </div>
  </div>
</div>
