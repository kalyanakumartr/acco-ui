        <h4 class="mt-0 pt-2 " >Update Your Details</h4>
        <div class="panel-body p-3">
            <form [formGroup]="updateForm" (ngSubmit)="updateProcess()">
                <div class="form-group pt-0 row justify-content-around">
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >FirstName<span class="text-danger">*</span></label>
                                <input formControlName="firstname" type="text" placeholder="FirstName">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >LastName<span class="text-danger">*</span></label>
                                <input formControlName="lastname" type="text" placeholder="Lastname">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group pt-0 row justify-content-around">
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Address1<span class="text-danger">*</span></label>
                                <input formControlName="address1" type="text" placeholder="Address1">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Address2</label>
                                <input formControlName="address2" type="text" placeholder="Address2">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group pt-0 row justify-content-around">
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >City<span class="text-danger">*</span></label>
                                <input formControlName="city" type="text" placeholder="City">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >State</label>
                                <input formControlName="state" type="text" placeholder="State">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group pt-0 row justify-content-around">
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Country<span class="text-danger">*</span></label>
                                <input formControlName="country" type="text" placeholder="Country">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Phonenumber <span class="text-danger">*</span></label>
                                <input formControlName="phonenumber" type="text" placeholder="Phonenumber">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-group pt-0 row justify-content-around">
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Email<span class="text-danger">*</span></label>
                                <input formControlName="email" type="text" placeholder="Email">
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="input-group mb-1">
                            <div class="input-field">
                                <!-- <span class="fa fa-user p-2" style="color:#964B00"></span> -->
                                <label >Username <span class="text-danger">*</span></label>
                                <input formControlName="username" type="text" placeholder="Username">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-light btn-elevate mr-2 ">
                        Update</button>
                    <!-- <button type="button" class="btn btn-light btn-elevate mr-2  " onclick="reset()">
                      Reset 
                    </button>-->
                </div>
            </form>

        </div>
    </div>
</div>
