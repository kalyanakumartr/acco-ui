<div class="outer">
    <app-navbar></app-navbar>
    <div class="container-fluid ">

        <div class="row">
            <div class="col mt-5 mx-5 p-2 text-brown" >
                <!-- <h2 class="mt-3">Cancellation Norms</h2> -->

                <form [formGroup]="cancelform">

                    <div class="form-group row">
                        <label  for="bookingid" class="col-sm-2 col-form-label">Bookingid</label>
                        <div class="col-sm-5">
                            <input formControlName="bookingid" type="text" readonly class="form-control-plaintext"
                                id="bookingid" value={{bookingid}}>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label  for="checkin" class="col-sm-2 col-form-label">Checkin</label>
                        <div class="col-sm-5">
                            <input formControlName="checkin" type="text" readonly class="form-control-plaintext"
                                id="checkin" [ngModel]=formattedcheckin>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label  for="checkout" class="col-sm-2 col-form-label">Checkout</label>
                        <div class="col-sm-5">
                            <input formControlName="checkout" type="text" readonly class="form-control-plaintext"
                                id="checkout" [ngModel]=formattedcheckout>

                        </div>
                    </div>

                    <div class="form-group row">
                        <label  for="reason" class="col-sm-2 col-form-label">Reason</label>
                        <div class="col-sm-5">
                            <textarea formControlName="reason" class="form-control"></textarea>
                            <small
                                *ngIf="cancelform.controls['reason'].dirty && cancelform.hasError('required','reason')"
                                class="text-danger form-inline  mt-0">*Messsage is required</small>
                            <small
                                *ngIf="cancelform.controls['reason'].dirty && cancelform.hasError('pattern','reason')"
                                class="text-danger form-inline  mt-0">*Messsage is invalid</small>
                        </div>
                    </div>

                    <button [disabled]=cancelform.invalid (click)="cancelbooking()" type="submit"
                        class="btn btn-light btn-elevate mr-2 mx-3 text-brown"
                       >
                        Cancel</button>
                    <button routerLink="/mybookings" type="submit" class="btn btn-light btn-elevate mr-2 text-brown"
                        >
                        Back</button>
                </form>
            </div>
            <div class="col mx-4">
                <h2 class="mt-4 text-center text-brown ">Cancellation policy</h2>
                <div class="table-responsive mb-3 mt-0">
                <table  >
                    <thead>
                        <tr >
                            <th class="align-middle" rowspan="2">No</th>
                            <th class="align-middle" rowspan="2">Time of Cancellation</th>
                            <th class="align-middle" rowspan="2">Cancellation percentage</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr  *ngFor="let i of cancelpolicydata let index = index;">
                            <td>{{i.cancelpolicyid}}</td>
                            <td>{{i.timeofcancel}}</td>
                            <td>{{i.cancelpercentage}}</td>
                        </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </div>
<!-- footer -->
<footer class="  py-1">
       
    <app-footer></app-footer>
  </footer>
</div>
