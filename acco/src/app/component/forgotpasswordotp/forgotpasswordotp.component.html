<div class="outer">
    <div class="container-fluid">
        <div class="row justify-content-center p-2">
            <div class="col-12 text-center mt-2 mb-4">
                <img src="assets/index_logo.jpg" style="width: 350px; height: 100px;">
                <span id="text" class="d-block mt-4 text-brown">Welcome to Maduraa Services</span>
            </div>
        </div>
        <div class="container d-flex justify-content-center align-items-center ">
            <div class="card form-box-style mb-5" style="width: 100%; max-width: 600px; height: 340px;">

                <div class="card-header text-center  ">
                    <h3 class="pt-3 font-weight-bold">
                        Enter OTP
                    </h3>
                </div>

                <div class="card-body  ">
                    <div class="form-group mt-3">
                        <div class="description">{{description}}</div>
                    </div>
                    <form [formGroup]="otpverification">
                        <div class="form-group pt-3 mt-2">
                            <div class="input-field flex-nowrap">
                                <!-- <label style="color:#964B00">UserName</label> -->
                                <ng-otp-input (onInputChange)="onOtpChange($event)"
                                    [config]="{length:6}"></ng-otp-input>
                                <!-- placeholder="UserName" -->
                            </div>
                        </div>
                        <div class="d-flex justify-content-start align-items-center">
                        <h5 class="mr-0">Didn't recieve OTP?</h5>
                        </div>
                        <div class="Resendotp d-flex align-items-end">
                            <button [disabled]="!enableresendotp" #resendbutton
                                (click)="sendotp();enableresendotp=false;" 
                                style="border: none;background: none;text-decoration: underline; margin-right: 5px;" >
                                Resend OTP</button>
                            <span style="justify-content: space-between;margin-right: 10px;">{{timeLeft}} secs
                                left</span>
                        </div>
                    
                        <div>
                            <button (click)="verifyotp()" type="submit" class="btn btn-light  mt-4 ">
                                Verify OTP</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <footer class="  py-1">
  
        <app-footer></app-footer>
      </footer>
</div>
