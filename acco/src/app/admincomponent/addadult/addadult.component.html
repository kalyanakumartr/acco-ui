<div class="text-center">
  <app-header></app-header>

  <h4 class="text-brown" style="font-size: 30px;">Logic History</h4>
  <!-- <p>Review your past bookings in an organized format.</p> -->
  <a href="#" class="btn btn-sm btn-light-primary ms-2" data-bs-toggle="modal" data-bs-target="#addAdultEditModal" (click)="addAdultEditData()">Add
    Adult
  </a>


</div>
<!-- <div class="text-right"> -->
<!-- </div> -->
<div class="tbl-container pt-2">
  <div class="table-responsive">

    <table>
      <thead>
        <tr>
          <th class="align-middle" rowspan="2">Adults</th>
          <th class="align-middle" rowspan="2">RoomTypeId </th>
          <th class="align-middle" rowspan="2">OptionType </th>
          <th class="align-middle" rowspan="2">BHK1</th>
          <th class="align-middle" rowspan="2">BHK2</th>
          <th class="align-middle" rolspan="3">BHK3</th>
          <th class="align-middle" rowspan="2">No Of Rooms</th>
          <th class="align-middle" rowspan="2">Bed</th>
          <th class="align-middle" rowspan="2">Price</th>
          <th class="align-middle" rowspan="2">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of dataObs$ | async">
          <td class="align-middle ">{{i.adult}}</td>
          <td class="align-middle ">{{i.roomtypeid}} </td>
          <td class="align-middle ">{{i.optiontype}} </td>
          <td class="align-middle ">{{i.bhktype1}} </td>

          <td class="align-middle ">{{i.bhktype2}} </td>

          <td class="align-middle ">{{i.bhktype3}} </td>

          <td class="align-middle ">{{i.noofrooms}} </td>

          <td class="align-middle ">{{i.bed}} </td>

          <td class="align-middle ">{{i.Price}} </td>

          <td><button style="border: none;" id="submit" class="col-me-3" data-bs-toggle="modal" data-bs-target="#addAdultEditModal" (click)="addAdultEditData()">
            <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen" viewBox="0 0 16 16">
              <path d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"/>
            </svg> -->

            <i class="fa fa-fw fa-edit" (click)="editadult()">
            </i>
            </button>
            <button style="border: none;">
              <!-- <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
              <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
              <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
            </svg> -->

            <i class="fas fa-trash" (click)="deladult()">
            </i>

          </button></td>

          <!-- <a href="#" data-bs-toggle="modal" data-bs-target="#bookingModal"
          (click)="setBookingData(i)">{{i.bookingid}}</a>
     -->
        </tr>


      </tbody>
    </table>
  </div>
  <div class="page">

    <mat-paginator #paginator [pageSizeOptions]="[5,10,15]" [pageSize]="5" showFirstLastButtons>

    </mat-paginator>
  </div>

</div>

<footer class="  py-1">

  <app-footer></app-footer>
</footer>


<div class="modal fade" id="addAdultEditModal" tabindex="-1" aria-labelledby="bookingModalLabel">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5 text-brown" id="exampleModalLabel">Add Adult List</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="addadult()">
          <div class="row">
            <div class="col-12 col-md-4 mb-2">
              <label class="text-brown font-weight-bold">Adult Number</label>
              <input name="adultnumber" formControlName="adultnumber"  type="text"
                placeholder="Adult Number">
            </div>
            <div class="col-12 col-md-4 mb-2">
              <label class="text-brown font-weight-bold">RoomTypeId</label>
              <input type="text" name="roomTypeId" formControlName="roomTypeId"    >
            </div>
            <div class="col-12 col-md-4 mb-3">
              <label class="text-brown font-weight-bold">Option Type</label>

              <select name="optionType"  >
                <option [value]="null">Option Type</option>
                <option value="0">R1</option>
                <option value="1">O1</option>


              </select>
            </div>

            <div class="row">


              <div class="col-12 col-md-4 mb-3">
                <label class="text-brown font-weight-bold">BHKTYPE-1</label>

                <select name="bhktype1">
                  <option [value]="null">Rooms</option>
                   <option value="0">0</option>
                  <option value="1">1</option>

                </select>
                </div>



              <div class="col-12 col-md-4 mb-3">
                <label class="text-brown font-weight-bold">BHKTYPE-2</label>

                <select  name="bhktype2">
                  <option [value]="null">Rooms</option>
                  <option value="0">0</option>
                  <option value="1">1</option>

                </select>
                </div>
              <div class="col-12 col-md-4 mb-3">
                <label class="text-brown font-weight-bold">BHKTYPE-3</label>

                <select name="bhktype3"   >
                  <option [value]="null">Rooms</option>
                  <option value="0">0</option>
                  <option value="1">1</option>

                </select>
                </div>

              </div>
            <div class="row">
              <div class="col-12 col-md-4 mb-3 p4">
                <label class="text-brown font-weight-bold">No Of Rooms</label>

                <select name="noofrooms"  >
                  <option [value]="null">Rooms</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                </select>
                 </div>
              <div class="col-12 col-md-4 mb-3">
                <label class="text-brown font-weight-bold">Bed</label>

                <input name="bed" type="text"    placeholder="Total Beds Number">

                </div>

              <div class="col-12 col-md-4 mb-3">
                <label class="text-brown font-weight-bold">PRICE</label>
                <input name="price"  type="text"  class="form-control" placeholder="Price">

                </div>
            </div>

          </div>
          <div class="modal-footer">
            <button  (click)="addadult()" type="submit" class="btn text-brown">Submit</button>
            <button type="button" class="btn text-brown" data-bs-dismiss="modal">Close</button>
          </div>

        </form>
      </div>


    </div>

  </div>
</div>
