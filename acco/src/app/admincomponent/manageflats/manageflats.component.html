<div class="outer">
    <app-header></app-header>
    <div class="container-fluid align-items-center justify-content-center">

        <div class="row ">
            <div class="header mt-3 mb-0">
                <h2>Booking Summary</h2>
            </div>
        </div>
        <div class="d-flex justify-content-center align-items-center table-responsive">

            <table style="max-width: 80%;" class=" table  mb-2">

                <thead>
                    <tr>
                        <th class="align-middle " rowspan="2">FlatNumber</th>
                        <th class="align-middle " rowspan="2">RoomNo</th>
                        <th class="align-middle " rowspan="2">FlatType</th>
                        <th class="align-middle " rowspan="3">Status</th>
                        <th class="align-middle " rowspan="2">Edit</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let i of dataObs$ | async">
                        <td class="align-middle ">{{i.roomid}}
                        <td class="align-middle ">{{i.roomno}}
                        <td class="align-middle ">{{i.roomname}}
                        <td class="align-middle ">{{i.statusname}}
                        <td class="align-middle ">
                            <i class="fa fa-fw fa-edit" (click)="editflat(i.roomid,i.roomno,i.roomname,i.statusname)">
                            </i>
                        </td>
                </tbody>
            </table>


        </div>
        <div class="page">

            <mat-paginator #paginator [pageSizeOptions]="[5,10,15]" [pageSize]="5" showFirstLastButtons>
            </mat-paginator>
        </div>
        <!-- </div> -->


    </div>

<!-- footer -->
<footer class="  py-1">
    <!-- <div class="container">
      <p class="text-black"> Stashook Technologies Private Ltd</p>
      
    </div> -->
    <app-footer></app-footer>
</footer>
</div>
