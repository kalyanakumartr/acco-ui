<div class="outer">
    <app-header></app-header>
    <div class="container">
      <div class="row">
        <div class="col">
          Column
          <h2 style="margin-top: 5px;color:#964B00">Checkout Room</h2>
          <form [formGroup]="selectRoomForm" (ngSubmit)="roomCheckOut()">
            <!-- (ngSubmit)="roomCheckin()" -->
            <div class="form-group row">
              <label style="color:#964B00" for="bookingid" class="col-sm-3 col-form-label">BookingId</label>
              <div class="col-sm-5">
                <input type="text" readonly class="form-control-plaintext" id="bookingid" value={{bookingid}}>
              </div>
            </div>
            <div class="form-group row">
              <label style="color:#964B00"  class="col-sm-3 col-form-label">CheckOutTime</label>
              <div class="col-sm-2">
                <input formControlName="checkout" type="datetime-local" [(ngModel)]="Todaydate"
                                        [min]="Todaydate" placeholder="To">
                
      
              </div>
            </div>
            
      
            <button [disabled]=selectRoomForm.invalid type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
              style="color: #964B00;background-color:#efc96a;margin-top: 130px;margin-bottom: 30px;">
              <!-- (click)="uploadFileToActivity()" -->
              Submit</button>
            <button routerLink="/frontdesk" type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
              style="color: #964B00;background-color:#efc96a ;margin-top: 130px ;margin-bottom: 30px;">
              Back</button>
          </form>
        
        </div>
        <div class="col" *ngIf="roomtypeid == 2?!isDisabled:isDisabled">
          Column
          <h2 style="margin-top: 5px;color:#964B00">Checkout EBReading</h2>
          <form [formGroup]="EBClosingForm" (ngSubmit)="EBClosing()">
            <div class="form-group row">
              <label style="color:#964B00" for="bookingid" class="col-sm-3 col-form-label">BookingId</label>
              <div class="col-sm-5">
                <input type="text" readonly class="form-control-plaintext" id="bookingid" value={{bookingid}}>
              </div>
            </div>
           
            <div class="form-group row">
              <label style="color:#964B00" for="closingdate" class="col-sm-3 col-form-label">ClosingDate</label>
              <div class="col-sm-5">
                <input type="text" readonly class="form-control-plaintext" id="closingdate" value={{Todaydate}}>
              </div>
            </div>
            <div class="form-group row">
              <label style="color:#964B00" for="closingunit" class="col-sm-3 col-form-label">ClosingUnit</label>
              <div class="col-sm-5">
                <input  formControlName="closingunit" type="text"  class="form-control-plaintext" id="closingunit" value="">
              </div>
            </div>

            <button [disabled]=EBClosingForm.invalid type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
              style="color: #964B00;background-color:#efc96a;margin-top: 80px;margin-bottom: 30px;">
              <!-- (click)="uploadFileToActivity()" -->
              Submit</button>
            <button routerLink="/frontdesk" type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
              style="color: #964B00;background-color:#efc96a ;margin-top: 80px ;margin-bottom: 30px;">
              Back</button>
          </form>
        </div>
        </div>
    </div>
    </div>
