<div class="outer">
  <app-header></app-header>
  <div class="container-fluid">
    <div class="row ">
      <div class="col   mx-5 mt-2">
        <!-- Column -->
        <h2 class="mt-3 text-brown">Checkout Log</h2>
        <!--form-->
        <form [formGroup]="selectRoomForm" (ngSubmit)="roomCheckOut()">
          <div class="form-group row">
            <label for="bookingid" class="col-sm-2 col-form-label">BookingId</label>
            <div class="col-sm-5">
              <input type="text" readonly class="form-control-plaintext" id="bookingid" value={{bookingid}}>
            </div>
          </div>
          <div class="form-group row mt-2">
            <label class="col-sm-2 col-form-label">CheckOutTime</label>
            <div class="col-sm-2 mx-3 mt-2">
              <input formControlName="checkout" type="datetime-local" [(ngModel)]="Todaydate" [min]="Todaydate"
                placeholder="To">


            </div>
          </div>

          <!-- button -->
          <button [disabled]=selectRoomForm.invalid type="submit" class="btn btn-light  mr-2 me-3 my-5 mt-5 text-brown">

            Submit</button>
          <button routerLink="/frontdesk" type="submit" class="btn btn-light btn-elevate mr-2  my-5 mt-5 text-brown">
            Back</button>
        </form>

      </div>
      <div class="col" *ngIf="roomtypeid == 2?!isDisabled:isDisabled">
        <!-- Column -->
        <h2 class="mt-3 text-brown">Checkout EBReading</h2>
        <form [formGroup]="EBClosingForm" (ngSubmit)="EBClosing()">
        <div class="form-group row">
          <label for="bookingid" class="col-sm-3 col-form-label">BookingId</label>
          <div class="col-sm-5">
            <input type="text" readonly class="form-control-plaintext" id="bookingid" value={{bookingid}}>
          </div>
        </div>

        <div class="form-group row mt-2">
          <label  for="closingdate" class="col-sm-3 col-form-label">ClosingDate</label>
          <div class="col-sm-5">
            <input type="text" readonly class="form-control-plaintext" id="closingdate" value={{Todaydate}}>
          </div>
        </div>
        <div class="form-group row mt-2">
          <label for="closingunit" class="col-sm-3 col-form-label">ClosingUnit</label>
          <div class="col-sm-5">
            <input formControlName="closingunit" type="text" class="form-control" id="closingunit" value="">
          </div>
        </div>

        <button [disabled]=EBClosingForm.invalid type="submit" class="btn btn-light mr-2 me-3 text-brown"
          style="margin-top: 80px;margin-bottom: 30px;">
          <!-- (click)="uploadFileToActivity()" -->
          Submit</button>
        <button routerLink="/frontdesk" type="submit" class="btn btn-light btn-elevate mr-2 margin-left text-brown"
          style="margin-top: 80px ;margin-bottom: 30px;">
          Back</button>
        </form>
      </div>

    </div>
    <!-- <button [disabled]=EBClosingForm.invalid type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
            style="color: #964B00;background-color:#efc96a;margin-top: 80px;margin-bottom: 30px;">
         
            Submit</button>
          <button routerLink="/frontdesk" type="submit" class="btn btn-light btn-elevate mr-2 margin-left"
            style="color: #964B00;background-color:#efc96a ;margin-top: 80px ;margin-bottom: 30px;">
            Back</button> -->
  </div>
  <!-- footer -->
  <footer class="  py-1">
    <!-- <div class="container">
      <p class="text-black"> Stashook Technologies Private Ltd</p>
      
    </div> -->
    <app-footer></app-footer>
  </footer>
</div>
