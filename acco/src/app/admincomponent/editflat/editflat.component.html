<div class="outer">
    <app-header></app-header>
    <div class="container-fluid">

        <h2 class="mt-1 ">Update Flat Status</h2>

            <form [formGroup]="editflatform">
                <div class="form-group row">
                    <label  for="flatid" class="col-sm-2 col-form-label">FlatId</label>
                    <div class="col-sm-5">
                        <input formControlName="flatid" type="text" readonly class="form-control-plaintext"
                            id="flatid" value={{flatid}}>
                    </div>
                </div>

                <div class="form-group row">
                    <label  for="roomno" class="col-sm-2 col-form-label">RoomNo</label>
                    <div class="col-sm-5">
                        <input formControlName="roomno" type="text" readonly class="form-control-plaintext"
                            id="roomno" value={{roomno}}>
                            <!-- <select formControlName="flattype"  >
                                <option [value]="null">-- Select  --</option>
                                <option readonly class="form-control-plaintext" id="flattype" value={{flattype}}>
                                    {{flattype}}
                                </option>
                                <option [value]="null">3BHK</option>
                            </select> -->
                    </div>
                </div>

                <div class="form-group row">
                    <label  for="bookingid" class="col-sm-2 col-form-label">FlatType</label>
                    <div class="col-sm-5">
                        <input formControlName="flattype" type="text" readonly class="form-control-plaintext"
                            id="flattype" value={{flattype}}>
                            <!-- <select formControlName="flatstatus"  >
                                <option [value]="null">-- Select  --</option>
                                <option readonly class="form-control-plaintext" id="flatstatus" value={{flatstatus}}>
                                    {{flatstatus}}
                                </option>
                                <option [value]="null">Blocked</option>
                                <option [value]="null">Avaliable</option>
                            </select> -->
                    </div>
                </div>

                <div class="form-group row">
                    <label for="bookingid" class="col-sm-2 col-form-label">UpdateStatus</label>
                    <div class="col-sm-1">
                        <!-- <input formControlName="updatestatus" type="text"  class="form-control-plaintext"
                            id="updatestatus" > -->
                            <select formControlName="updatestatus"  >
                                <option [value]="0">-- Select Status  --</option>
                                <!-- <option readonly class="form-control-plaintext" id="flatstatus" value={{flatstatus}}>
                                    {{flatstatus}}
                                </option> -->
                                <option  *ngFor="let type of roomStatus" [value]="type.statusid" >{{ type.statusname}}</option>
                                <!-- <option [value]="1">Avaliable</option>
                                <option [value]="2">HouseKeeping</option>
                                <option [value]="3">OnRepair</option> -->
                            </select>
                    </div>
                </div>

                <div class="form-group row">
                    <label  for="bookingid" class="col-sm-2 col-form-label">Reason</label>
                    <div class="col-sm-5">
                       <textarea formControlName="reason" class="form-control"></textarea>
                        <small *ngIf="editflatform.controls['reason'].dirty && editflatform.hasError('required','reason')"  
                                          class="text-danger form-inline  mt-0">*Messsage is required</small>
                      <small *ngIf="editflatform.controls['reason'].dirty && editflatform.hasError('pattern','reason')"  
                                          class="text-danger form-inline  mt-0">*Messsage is invalid</small>
                    </div>
                </div>

                <button [disabled]=editflatform.invalid (click)="editflatdata()" type="submit"
                    class="btn btn-light btn-elevate mr-2 margin-left mt-5 mb-5 "
                    >
                    Submit</button>
                <button routerLink="/manageflats" type="submit" class="btn btn-light btn-elevate mr-2 mt-5 mb-5 "
                    >
                    Back</button>

            </form>
       


    </div>
</div>
